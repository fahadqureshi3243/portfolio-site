<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Workflow thumbnail (animated)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;800&amp;family=JetBrains+Mono:wght@400;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="height: 158px; box-sizing: border-box; border-radius: 10px; background-color: #0b1020; background-image: radial-gradient(#1c2546 1px, transparent 1px); background-size: 14px 14px; padding: 10px 10px 9px; display: flex; flex-direction: column; justify-content: space-between; font-family: 'Inter Tight', system-ui, sans-serif; color: #e6eaf5; overflow: hidden">
  <div style="display: flex; justify-content: space-between; align-items: center; gap: 8px">
    <span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; color: #8b95b5; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">n8n · {{meta}}</span>
    <span style="display: inline-flex; align-items: center; gap: 5px; font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700; color: #86efac; white-space: nowrap"><span style="width: 6px; height: 6px; border-radius: 50%; background: #34d399; box-shadow: 0 0 8px #34d399"></span>LIVE</span>
  </div>
  <div style="position: relative; height: 64px">
    <div style="position: absolute; top: 17px; left: {{lineL}}; right: {{lineR}}; height: 2px; background: #2f3a5c"></div>
    <div style="position: absolute; top: 17px; left: {{lineL}}; width: {{progW}}; height: 2px; background: #FF6A2B"></div>
    <div style="position: absolute; top: 13px; left: {{dotX}}; width: 10px; height: 10px; border-radius: 50%; background: {{dotC}}; box-shadow: 0 0 10px {{dotC}}; opacity: {{dotOp}}; z-index: 2"></div>
    <div style="position: absolute; inset: 0; display: flex; align-items: flex-start">
      <sc-for list="{{nodes}}" as="n" hint-placeholder-count="6">
        <div style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 7px">
          <div style="position: relative; width: 34px; height: 34px; border-radius: 9px; background: #131a2f; border: 1.5px solid {{n.bd}}; box-shadow: {{n.glow}}; display: flex; align-items: center; justify-content: center; box-sizing: border-box; z-index: 1">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{n.c}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="opacity: {{n.icOp}}"><path d="{{n.d}}"></path></svg>
            <span style="position: absolute; right: -5px; bottom: -5px; width: 10px; height: 10px; border-radius: 50%; background: #10b981; border: 2px solid #0b1020; opacity: {{n.ck}}"></span>
          </div>
          <span style="font-size: 9.5px; font-weight: 600; color: #c6cde3; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 2px">{{n.l}}</span>
        </div>
      </sc-for>
    </div>
  </div>
  <div style="display: flex; justify-content: space-between; align-items: center; gap: 8px">
    <span style="font-size: 10.5px; color: #b7bfd8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{cap}}</span>
    <span style="font-size: 11px; font-weight: 800; color: #FF8A55; white-space: nowrap">Watch full flow →</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"kind":{"editor":"enum","options":["rfq","inv","hr","ops","ar"],"default":"rfq"},"$preview":{"width":300,"height":158}}'>

: "#f59e0b"}, {"l": "RFP", "d": "M5 5.5h14a2 2 0 0 1 2 2v9a2 2 0 0 1 -2 2h-14a2 2 0 0 1 -2 -2v-9a2 2 0 0 1 2 -2zM3.5 7l8.5 6 8.5-6", "c": "#ef4444"}, {"l": "AI pick", "d": "M12 3l1.9 4.6L18.5 9.5l-4.6 1.9L12 16l-1.9-4.6L5.5 9.5l4.6-1.9zM18.5 15l.8 1.9 1.9.8-1.9.8-.8 1.9-.8-1.9-1.9-.8 1.9-.8z", "c": "#a78bfa"}, {"l": "PO", "d": "M3 12a9 9 0 1 0 18 0a9 9 0 1 0 -18 0M3 12h18M12 3c2.5 2.7 3.8 5.7 3.8 9s-1.3 6.3-3.8 9c-2.5-2.7-3.8-5.7-3.8-9S9.5 5.7 12 3z", "c": "#818cf8"}, {"l": "GRN", "d": "M4 8V5.5A1.5 1.5 0 0 1 5.5 4H8M16 4h2.5A1.5 1.5 0 0 1 20 5.5V8M20 16v2.5a1.5 1.5 0 0 1-1.5 1.5H16M8 20H5.5A1.5 1.5 0 0 1 4 18.5V16M8 9h8M8 12h8M8 15h5", "c": "#22c55e"}, {"l": "3-way", "d": "M9 6l-5 6 5 6M15 6l5 6-5 6", "c": "#fb923c"}]}, "hr": {"meta": "22 nodes · AI screening", "nodes": [{"l": "Request", "d": "M7 4h10a2 2 0 0 1 2 2v13a2 2 0 0 1 -2 2h-10a2 2 0 0 1 -2 -2v-13a2 2 0 0 1 2 -2zM9 2.5h6v3H9zM8.5 11h7M8.5 14.5h7M8.5 18h4", "c": "#60a5fa"}, {"l": "Pool", "d": "M6 3.5h12a2 2 0 0 1 2 2v13a2 2 0 0 1 -2 2h-12a2 2 0 0 1 -2 -2v-13a2 2 0 0 1 2 -2zM4 9h16M4 14.5h16M10 3.5v17", "c": "#22c55e"}, {"l": "AI JD", "d": "M12 3l1.9 4.6L18.5 9.5l-4.6 1.9L12 16l-1.9-4.6L5.5 9.5l4.6-1.9zM18.5 15l.8 1.9 1.9.8-1.9.8-.8 1.9-.8-1.9-1.9-.8 1.9-.8z", "c": "#a78bfa"}, {"l": "Post job", "d": "M3 12a9 9 0 1 0 18 0a9 9 0 1 0 -18 0M3 12h18M12 3c2.5 2.7 3.8 5.7 3.8 9s-1.3 6.3-3.8 9c-2.5-2.7-3.8-5.7-3.8-9S9.5 5.7 12 3z", "c": "#818cf8"}, {"l": "AI screen", "d": "M12 3l1.9 4.6L18.5 9.5l-4.6 1.9L12 16l-1.9-4.6L5.5 9.5l4.6-1.9zM18.5 15l.8 1.9 1.9.8-1.9.8-.8 1.9-.8-1.9-1.9-.8 1.9-.8z", "c": "#a78bfa"}, {"l": "Interview", "d": "M5.5 5h13a2 2 0 0 1 2 2v11a2 2 0 0 1 -2 2h-13a2 2 0 0 1 -2 -2v-11a2 2 0 0 1 2 -2zM3.5 10h17M8 3v4M16 3v4M8 14h2M14 14h2", "c": "#22c55e"}]}, "ops": {"meta": "19 nodes · ERP · AI", "nodes": [{"l": "Order", "d": "M5 5.5h14a2 2 0 0 1 2 2v9a2 2 0 0 1 -2 2h-14a2 2 0 0 1 -2 -2v-9a2 2 0 0 1 2 -2zM3.5 7l8.5 6 8.5-6", "c": "#ef4444"}, {"l": "AI read", "d": "M12 3l1.9 4.6L18.5 9.5l-4.6 1.9L12 16l-1.9-4.6L5.5 9.5l4.6-1.9zM18.5 15l.8 1.9 1.9.8-1.9.8-.8 1.9-.8-1.9-1.9-.8 1.9-.8z", "c": "#a78bfa"}, {"l": "BOM", "d": "M12 3l9 5-9 5-9-5zM3 12.5l9 5 9-5M3 17l9 5 9-5", "c": "#2dd4bf"}, {"l": "Material", "d": "M6 3.5h12a2 2 0 0 1 2 2v13a2 2 0 0 1 -2 2h-12a2 2 0 0 1 -2 -2v-13a2 2 0 0 1 2 -2zM4 9h16M4 14.5h16M10 3.5v17", "c": "#22c55e"}, {"l": "Labor", "d": "M8 8a4 4 0 1 0 8 0a4 4 0 1 0 -8 0M4.5 20c.8-3.8 3.8-6 7.5-6s6.7 2.2 7.5 6", "c": "#c084fc"}, {"l": "Schedule", "d": "M12 3l1.9 4.6L18.5 9.5l-4.6 1.9L12 16l-1.9-4.6L5.5 9.5l4.6-1.9zM18.5 15l.8 1.9 1.9.8-1.9.8-.8 1.9-.8-1.9-1.9-.8 1.9-.8z", "c": "#a78bfa"}]}};
    this.timer = null;
  }
  componentDidMount() {
    let reduce = false;
    try { reduce = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches); } catch (e) {}
    if (reduce) { this.setState({ t: 99999 }); return; }
    const offset = { rfq: 0, inv: 900, hr: 1800, ops: 2700, ar: 450 }[this.props.kind] || 0;
    this.setState({ t: offset });
    this.timer = setInterval(() => {
      if (typeof document !== 'undefined' && document.hidden) return;
      const d = this.TH[this.props.kind] || this.TH.rfq;
      const period = d.nodes.length * 750 + 1600;
      this.setState({ t: (this.state.t + 50) % period });
    }, 50);
  }
  componentWillUnmount() { if (this.timer) clearInterval(this.timer); }
  renderVals() {
    const d = this.TH[this.props.kind] || this.TH.rfq;
    const n = d.nodes.length, t = this.state.t, STEP = 750;
    const idx = Math.floor(t / STEP), ph = t - idx * STEP, finished = idx >= n;
    const center = (i) => (i + 0.5) / n * 100;
    const nodes = d.nodes.map((x, i) => {
      const active = !finished && i === idx, done = finished || i < idx;
      return { l: x.l, d: x.d, c: x.c, bd: (active || done) ? x.c : '#2a3456',
        glow: active ? '0 0 0 3px ' + x.c + '33, 0 0 14px ' + x.c : 'none', icOp: (active || done) ? 1 : 0.5, ck: done ? 1 : 0 };
    });
    let dotX = center(0), dotOp = 0, dotC = '#FF6A2B';
    if (!finished && idx > 0 && ph < 420) { const p = ph / 420; dotX = center(idx - 1) + (center(idx) - center(idx - 1)) * p; dotOp = 1; dotC = d.nodes[idx].c; }
    const progEnd = finished ? center(n - 1) : (idx > 0 ? center(idx - 1) + (center(idx) - center(idx - 1)) * Math.min(1, ph / 420) : center(0));
    const lineL = center(0);
    return {
      meta: d.meta, nodes: nodes,
      lineL: lineL + '%', lineR: lineL + '%', progW: Math.max(0, progEnd - lineL) + '%',
      dotX: 'calc(' + dotX + '% - 5px)', dotOp: dotOp, dotC: dotC,
      cap: finished ? '✓ Run complete · outputs delivered' : 'Step ' + (idx + 1) + '/' + n + ' · ' + d.nodes[idx].l
    };
  }
}
</script>
